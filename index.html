<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matchday</title>
  <meta name="description" content="Personal, ad-free live football scores">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://site.api.espn.com" crossorigin>
  <link rel="preconnect" href="https://a.espncdn.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Apply a saved theme choice before first paint (no flash). -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-row">
      <button id="back" class="icon-btn" type="button" aria-label="Back" hidden>
        <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="title">Matchday</h1>
      <button id="refresh" class="icon-btn" type="button" aria-label="Refresh">
        <svg class="icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button id="theme" class="icon-btn" type="button" aria-label="Theme"></button>
    </div>
    <div id="subbar"></div>
  </header>

  <main id="view"></main>

  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p style="padding:24px;text-align:center">This app needs JavaScript.</p></noscript>
</body>
</html>
